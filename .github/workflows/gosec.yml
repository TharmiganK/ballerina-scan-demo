name: gosec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod

      # The gosec Docker action runs from the repository root, but the Go module lives in go/.
      - name: Run gosec
        working-directory: go
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -no-fail -fmt sarif -out gosec.sarif ./...

      # gosec writes URIs relative to the module, so prefix them to resolve against the repository root.
      - name: Make paths repository-relative
        run: jq '(.runs[].results[].locations[].physicalLocation.artifactLocation.uri) |= "go/" + .' go/gosec.sarif > gosec.sarif

      - uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: gosec.sarif
          category: gosec
