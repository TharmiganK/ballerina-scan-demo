# Reference workflow: run `bal scan`, publish SARIF to GitHub code scanning,
# and optionally fail the build on security findings.
name: Ballerina scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write   # required by upload-sarif
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.4
        with:
          version: 2201.13.5

      - name: Install the scan tool
        run: bal tool pull scan

      # `--format=sarif` writes ONLY target/report/scan_results.sarif.
      # It does not also write scan_results.json, so anything that needs the
      # JSON report must run `bal scan` a second time without --format.
      - name: Run bal scan
        run: bal scan --format=sarif

      # `bal scan` always exits 0, even when the scan fails to produce results.
      # Without this guard an empty results array uploads cleanly and GitHub
      # reads it as "every alert fixed", which is indistinguishable from a real
      # regression. Fail loudly instead.
      - name: Verify the SARIF was produced
        run: |
          f=target/report/scan_results.sarif
          test -f "$f" || { echo "::error::$f was not produced"; exit 1; }
          n=$(jq '.runs[0].results | length' "$f")
          echo "findings: $n"
          test "$n" -gt 0 || { echo "::error::SARIF contains no results"; exit 1; }

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/report/scan_results.sarif
          category: bal-scan

      - name: Keep the SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-sarif
          path: target/report/scan_results.sarif

      # ---------------------------------------------------------------
      # GA preview.
      #
      # The scan tool does not yet emit rule metadata, so this step adds it to
      # a copy of the report: severity, security-severity, CWE and OWASP tags,
      # rule names and remediation text. It is uploaded under its own category
      # and tool name so the two can be compared side by side in the same
      # repository -- see RESULTS.md.
      #
      # This is a preview of GA plan items 1.1 and 1.4, not a proposal for how
      # the tool should work. At GA this metadata comes from the rule model.
      # ---------------------------------------------------------------
      - name: Build the GA-preview SARIF
        run: python3 scripts/enrich_sarif.py target/report/scan_results.sarif target/report/scan_results_ga_preview.sarif

      - name: Upload the GA-preview SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/report/scan_results_ga_preview.sarif
          category: bal-scan-ga-preview

      - name: Keep the GA-preview SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-ga-preview-sarif
          path: target/report/scan_results_ga_preview.sarif

      # Severity gate.
      #
      # This keys off the SARIF `level`, where every security rule is currently
      # `warning` and every language rule is `note` -- because `bal scan` derives
      # the SARIF level from the rule *kind*, and no rule is classified BUG.
      # Nothing therefore emits `error`, so a gate written against `error` can
      # never fire. Count `warning` results instead.
      #
      # Once the tool emits a real per-rule severity this becomes a threshold on
      # `properties.security-severity` and this step gets much shorter.
      - name: Fail on security findings
        if: github.event_name == 'pull_request'
        env:
          MAX_ALLOWED: 0
        run: |
          f=target/report/scan_results.sarif
          count=$(jq '[.runs[0].results[] | select(.level == "warning")] | length' "$f")
          echo "security findings (SARIF level=warning): $count (allowed: $MAX_ALLOWED)"
          if [ "$count" -gt "$MAX_ALLOWED" ]; then
            echo "::error::$count security findings exceed the threshold of $MAX_ALLOWED"
            exit 1
          fi
